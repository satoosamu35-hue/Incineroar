
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [DesertDYnasty]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build EXE
        run: |
          pyinstaller --onefile --clean --name DesertDYnasty DesertDYnasty.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: DesertDYnasty-Windows
          path: dist/DesertDYnasty.exe
